services:
  shadow:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ./data:/app/data:z
      - ./logs:/app/logs:z
      # Cookbook remote-server SSH identity. Shadow can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ./data/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Shadow
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ./data/huggingface:/app/.cache/huggingface:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the shadow user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ./data/local:/app/.local:z
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - SHADOW_HOME_AGENT_URL=${SHADOW_HOME_AGENT_URL:-}
      - SHADOW_HOME_AGENT_SOCKET=${SHADOW_HOME_AGENT_SOCKET:-}
      - SHADOW_HOME_AGENT_TOKEN=${SHADOW_HOME_AGENT_TOKEN:-}
      - SHADOW_HOME_AGENT_ALLOW_PUBLIC=${SHADOW_HOME_AGENT_ALLOW_PUBLIC:-false}
      - SHADOW_PC_CONFIRM_TTL_SECONDS=${SHADOW_PC_CONFIRM_TTL_SECONDS:-300}
      - SHADOW_PC_OWNER=${SHADOW_PC_OWNER:-}
      - SHADOW_PC_ACCESS_PATH=${SHADOW_PC_ACCESS_PATH:-data/shadow-pc-access.json}
      - SHADOW_DEVICES_PATH=${SHADOW_DEVICES_PATH:-data/shadow-devices.json}
      - SHADOW_DEVICE_JOBS_PATH=${SHADOW_DEVICE_JOBS_PATH:-data/shadow-device-jobs.json}
      - SHADOW_TELEGRAM_STORE_PATH=${SHADOW_TELEGRAM_STORE_PATH:-data/shadow-telegram-chats.json}
      - SHADOW_MESH_ENABLED=${SHADOW_MESH_ENABLED:-false}
      - SHADOW_MESH_GATEWAY_URL=${SHADOW_MESH_GATEWAY_URL:-http://meshcentral-gateway:8099}
      - SHADOW_MESH_GATEWAY_KEY=${SHADOW_MESH_GATEWAY_KEY:-}
      - SHADOW_MESH_PUBLIC_PATH=${SHADOW_MESH_PUBLIC_PATH:-/remote/}
      - SHADOW_REMOTE_STATE_PATH=${SHADOW_REMOTE_STATE_PATH:-data/shadow-remote.json}
      # Per-account agent browser (src/browser_manager.py). Domain lists are
      # comma-separated; ALLOW restricts to those domains, DENY always blocks.
      - SHADOW_BROWSER_ALLOW_DOMAINS=${SHADOW_BROWSER_ALLOW_DOMAINS:-}
      - SHADOW_BROWSER_DENY_DOMAINS=${SHADOW_BROWSER_DENY_DOMAINS:-}
      - SHADOW_BROWSER_ALLOW_PRIVATE=${SHADOW_BROWSER_ALLOW_PRIVATE:-false}
      - SHADOW_BROWSER_ACTIONS_PER_MINUTE=${SHADOW_BROWSER_ACTIONS_PER_MINUTE:-30}
      - SHADOW_BROWSER_CONFIRM_TTL_SECONDS=${SHADOW_BROWSER_CONFIRM_TTL_SECONDS:-300}
      - SHADOW_BROWSER_MAX_CONTEXTS=${SHADOW_BROWSER_MAX_CONTEXTS:-3}
      - SHADOW_TELEGRAM_BOT_TOKEN=${SHADOW_TELEGRAM_BOT_TOKEN:-}
      - SHADOW_ADMIN_USER=${SHADOW_ADMIN_USER:-admin}
      - SHADOW_ADMIN_PASSWORD=${SHADOW_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - SHADOW_INPROCESS_POLLERS=${SHADOW_INPROCESS_POLLERS:-1}
      - SHADOW_INPROCESS_TASKS=${SHADOW_INPROCESS_TASKS:-1}
      - SHADOW_SCRIPT_HOST=${SHADOW_SCRIPT_HOST:-localhost}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_SESSIONS_PATH=${TELEGRAM_SESSIONS_PATH:-data/telegram-sessions}
      - TELEGRAM_CACHE_PATH=${TELEGRAM_CACHE_PATH:-data/telegram-cache}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  shadow-telegram:
    build: .
    profiles: ["telegram"]
    command: ["python", "scripts/shadow_telegram.py"]
    volumes:
      - ./data:/app/data:z
    environment:
      - SHADOW_TELEGRAM_BOT_TOKEN=${SHADOW_TELEGRAM_BOT_TOKEN:-}
      - SHADOW_HOME_AGENT_URL=${SHADOW_HOME_AGENT_URL:-}
      - SHADOW_HOME_AGENT_SOCKET=${SHADOW_HOME_AGENT_SOCKET:-}
      - SHADOW_HOME_AGENT_TOKEN=${SHADOW_HOME_AGENT_TOKEN:-}
      - SHADOW_HOME_AGENT_ALLOW_PUBLIC=${SHADOW_HOME_AGENT_ALLOW_PUBLIC:-false}
      - SHADOW_PC_CONFIRM_TTL_SECONDS=${SHADOW_PC_CONFIRM_TTL_SECONDS:-300}
      - SHADOW_PC_OWNER=${SHADOW_PC_OWNER:-}
      - SHADOW_PC_ACCESS_PATH=${SHADOW_PC_ACCESS_PATH:-data/shadow-pc-access.json}
      - SHADOW_DEVICES_PATH=${SHADOW_DEVICES_PATH:-data/shadow-devices.json}
      - SHADOW_DEVICE_JOBS_PATH=${SHADOW_DEVICE_JOBS_PATH:-data/shadow-device-jobs.json}
      - SHADOW_TELEGRAM_STORE_PATH=${SHADOW_TELEGRAM_STORE_PATH:-data/shadow-telegram-chats.json}
    depends_on:
      - shadow
    restart: unless-stopped

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'shadow-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

  # PO-token provider for the music player. YouTube challenges datacenter IPs
  # with a "confirm you're not a bot" check; yt-dlp's bgutil plugin (installed
  # in the app image) fetches PO tokens from this helper to get past it. No
  # Google account needed. Reachable from the app as http://bgutil-pot:4416.
  bgutil-pot:
    image: docker.io/brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  meshcentral-init:
    image: ghcr.io/ylianst/meshcentral:1.2.0
    profiles: ["remote"]
    entrypoint: ["/bin/sh", "/shadow/meshcentral-init.sh"]
    environment:
      - SHADOW_MESH_ADMIN_USER=${SHADOW_MESH_ADMIN_USER:-shadow_mesh_admin}
      - SHADOW_MESH_ADMIN_PASSWORD=${SHADOW_MESH_ADMIN_PASSWORD:-}
      - SHADOW_MESH_PUBLIC_HOST=${SHADOW_MESH_PUBLIC_HOST:-localhost}
      - SHADOW_MESH_PUBLIC_ORIGIN=${SHADOW_MESH_PUBLIC_ORIGIN:-http://localhost:7000}
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - ./scripts/meshcentral-init.sh:/shadow/meshcentral-init.sh:ro
      - ./config/meshcentral/config.json.template:/shadow/config.json.template:ro
    restart: "no"

  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.2.0
    profiles: ["remote"]
    environment:
      - CONFIG_FILE=/opt/meshcentral/meshcentral-data/config.json
      - DYNAMIC_CONFIG=false
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
    ports:
      - "${SHADOW_MESH_BIND:-127.0.0.1}:${SHADOW_MESH_PORT:-8443}:443"
    depends_on:
      meshcentral-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:443/remote/refresh.ashx >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  meshcentral-gateway:
    image: ghcr.io/ylianst/meshcentral:1.2.0
    profiles: ["remote"]
    entrypoint: ["node", "/shadow/meshcentral-gateway.js"]
    environment:
      - PORT=8099
      - SHADOW_MESH_GATEWAY_KEY=${SHADOW_MESH_GATEWAY_KEY:-}
      - SHADOW_MESH_ADMIN_USER=${SHADOW_MESH_ADMIN_USER:-shadow_mesh_admin}
      - SHADOW_MESH_ADMIN_PASSWORD=${SHADOW_MESH_ADMIN_PASSWORD:-}
      - SHADOW_MESH_INTERNAL_URL=wss://meshcentral:443/remote
    volumes:
      - ./services/meshcentral-gateway/server.js:/shadow/meshcentral-gateway.js:ro
    expose:
      - "8099"
    depends_on:
      meshcentral:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Guacamole — clientless HTML5 remote desktop (RDP/VNC/SSH), opt-in via
  # the "guacamole" profile. Runs alongside (not replacing) MeshCentral until the
  # cutover is verified. The web UI binds to loopback and is meant to be proxied
  # as same-origin /remote/ behind Shadow's TLS, like the old console.
  guac-postgres:
    image: docker.io/library/postgres:15-alpine
    profiles: ["guacamole"]
    environment:
      - POSTGRES_DB=${GUAC_DB_NAME:-guacamole_db}
      - POSTGRES_USER=${GUAC_DB_USER:-guacamole}
      - POSTGRES_PASSWORD=${GUAC_DB_PASSWORD:-guacamole}
    volumes:
      - guac-db:/var/lib/postgresql/data
      - ./config/guacamole/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  guacd:
    image: docker.io/guacamole/guacd:1.5.5
    profiles: ["guacamole"]
    restart: unless-stopped

  guacamole:
    image: docker.io/guacamole/guacamole:1.5.5
    profiles: ["guacamole"]
    environment:
      - GUACD_HOSTNAME=guacd
      - POSTGRESQL_HOSTNAME=guac-postgres
      - POSTGRESQL_DATABASE=${GUAC_DB_NAME:-guacamole_db}
      - POSTGRESQL_USER=${GUAC_DB_USER:-guacamole}
      - POSTGRESQL_PASSWORD=${GUAC_DB_PASSWORD:-guacamole}
      - POSTGRESQL_AUTO_CREATE_ACCOUNTS=true
      # Serve the webapp at the context root so it embeds cleanly at /remote/.
      - WEBAPP_CONTEXT=ROOT
    ports:
      - "${GUAC_BIND:-127.0.0.1}:${GUAC_PORT:-8085}:8080"
    depends_on:
      - guacd
      - guac-postgres
    restart: unless-stopped

volumes:
  guac-db:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  meshcentral-data:
  meshcentral-files:
  meshcentral-backups:
